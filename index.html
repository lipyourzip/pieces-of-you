/* Layout: the form is a small booklet. Cover, two intro pages, one question per page, back cover. Black ink on white paper. */
:root{--paper:#fff;--ink:#000;--soft:#666;--dot:#c4c4c4;--font:"PiecesFlow","Nunito",ui-rounded,system-ui,sans-serif;color-scheme:light}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.6;margin:0;
  padding-block:20px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3,p,ol,ul{margin:0}
p{text-wrap:pretty}
.soft{color:var(--soft)}
.book{max-width:560px;margin:0 auto;min-height:calc(100vh - 48px);min-height:calc(100dvh - 48px);display:flex;flex-direction:column}
.lang{display:flex;justify-content:flex-end;gap:6px}
.lang button{font:inherit;font-size:14px;font-weight:700;letter-spacing:.08em;background:none;border:1px solid transparent;border-radius:999px;padding:4px 12px;color:var(--soft);cursor:pointer}
.lang button[aria-pressed="true"]{color:var(--ink);border-color:var(--ink)}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--ink);outline-offset:3px}

.pg{flex:1;display:flex;flex-direction:column;padding-top:18px}
.pg[hidden]{display:none!important}
.body{flex:1}
.center{text-align:center}

/* cover */
.pre{font-size:26px;font-weight:700;line-height:1.1;text-align:center}
.you{font-size:clamp(92px,26vw,132px);font-weight:700;line-height:1;letter-spacing:.02em;-webkit-text-stroke:2.4px var(--ink);margin-top:2px;text-align:center}
.vol{font-size:12px;letter-spacing:.42em;color:var(--soft);font-weight:700;margin:6px 0 24px;padding-left:.42em;text-align:center}
.grid{display:block;width:210px;max-width:58%;margin:0 auto;color:var(--ink)}
.tag{margin-top:24px;font-size:19px;font-weight:700;text-align:center}
.tag2{margin-top:2px;color:var(--soft);text-align:center}

/* content pages */
h2{font-size:26px;line-height:1.25;font-weight:700;text-wrap:balance}
.q{font-size:26px;line-height:1.25;font-weight:700;text-wrap:balance;margin-bottom:6px}
.hint{color:var(--soft);font-size:15px;margin-bottom:20px}
.stack{display:grid;gap:14px;margin-top:14px}
.lead{font-size:19px}
.note{font-weight:700}
.offer{list-style:none;padding:0;margin:2px 0 0;display:flex;flex-wrap:wrap;gap:8px}
.offer li{border:1.6px solid var(--ink);border-radius:999px;padding:5px 14px;font-size:15px}
.steps{list-style:none;padding:0;display:grid;gap:14px;margin-top:18px}
.steps li{display:grid;grid-template-columns:44px 1fr;gap:14px;align-items:center}
.steps .n{width:44px;height:44px;border:1.6px solid var(--ink);border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:18px}
.avail{margin-top:22px;padding:14px 18px;border:1.6px solid var(--ink);border-radius:16px}

/* answers */
.chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.chip{font:inherit;font-size:17px;line-height:1.3;color:var(--ink);background:var(--paper);border:1.6px solid var(--ink);border-radius:999px;padding:9px 18px;cursor:pointer;text-align:left;-webkit-tap-highlight-color:transparent}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.chips.col{flex-direction:column;align-items:stretch}
.chips.col .chip{border-radius:18px}
.field{margin-top:18px}
.lbl{display:block;font-weight:700;font-size:17px;margin-bottom:8px}
textarea,input[type=text],input[type=email],input[type=date]{width:100%;font:inherit;font-size:17px;color:var(--ink);background:var(--paper);border:1.6px solid var(--ink);border-radius:16px;padding:12px 16px;display:block}
textarea{min-height:200px;resize:vertical;line-height:1.55;
  background-image:radial-gradient(var(--dot) 1.2px,transparent 1.3px);background-size:22px 22px;background-position:11px 11px}
::placeholder{color:#8a8a8a}
.err{display:none;font-weight:700;font-size:15px;margin-top:14px}
.err.on{display:block}

/* controls */
.nav{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-top:28px}
.nav.solo{justify-content:center}
.btn{font:inherit;font-weight:700;font-size:17px;background:var(--ink);color:var(--paper);border:1.6px solid var(--ink);border-radius:999px;padding:12px 28px;cursor:pointer}
.btn.ghost{background:var(--paper);color:var(--ink)}
.btn[disabled]{opacity:.55;cursor:wait}
.pn{text-align:center;color:#999;font-size:14px;margin-top:22px;min-height:1.4em}
.end .big{font-size:24px;font-weight:700;text-wrap:balance;text-align:center;margin-top:30px}
.end .by{margin-top:10px;color:var(--soft);font-size:15px;text-align:center}
.end .x{margin-top:2px;font-size:15px;text-align:center}
@media (prefers-reduced-motion:no-preference){.pg{animation:in .25s ease-out}@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}.btn:active,.chip:active{transform:scale(.97)}}

    qHead(body,d.qPerson,d.hPerson);body.appendChild(textArea("person"));body.appendChild(errP(d.eText));pg.appendChild(body);pg.appendChild(navBtns(false));
  }else if(cur==="explore"){
    qHead(body,d.qExplore,d.hExplore);body.appendChild(textArea("explore"));pg.appendChild(body);pg.appendChild(navBtns(false));
  }else if(cur==="blang"){
    qHead(body,d.qLang);body.appendChild(chipGroup(["English","Türkçe"],{English:"English","Türkçe":"Türkçe"},"blang",false));pg.appendChild(body);pg.appendChild(navBtns(false));
  }else if(cur==="date"){
    qHead(body,d.qDate,d.hDate);var f=el("div","field");var i=el("input");i.type="date";i.id="in-date";i.value=A.date;i.addEventListener("input",function(){A.date=i.value;});f.appendChild(i);body.appendChild(f);pg.appendChild(body);pg.appendChild(navBtns(false));
  }else if(cur==="you"){
    qHead(body,d.qYou);body.appendChild(inp("name","text",d.lName,"name"));body.appendChild(inp("mail","email",d.lMail,"email"));body.appendChild(inp("ig","text",d.lIg));
    var bc=el("input");bc.type="checkbox";bc.id="botcheck";bc.tabIndex=-1;bc.setAttribute("aria-hidden","true");bc.style.cssText="position:absolute;left:-9999px";body.appendChild(bc);
    body.appendChild(errP(err||d.eMail));pg.appendChild(body);pg.appendChild(navBtns(true));
  }else if(cur==="done"){
    var e=el("div","end");
    body.appendChild(el("div","pre","Pieces of"));body.appendChild(el("div","you","YOU"));body.appendChild(el("div","vol",d.vol));
    body.appendChild(document.getElementById("t-grid").content.cloneNode(true));
    body.appendChild(el("p","tag",d.thT));body.appendChild(el("p","tag2",d.thP));
    e.appendChild(el("p","big",d.end));e.appendChild(el("p","by",d.by));e.appendChild(el("p","x","– xxx"));body.appendChild(e);
    pg.appendChild(body);
  }
  renderNumber();
}
function renderNumber(){var s=steps(),i=s.indexOf(cur);pn.textContent=(i>=1&&cur!=="done")?String(i):"";}

function validate(){
  var d=D();
  function bad(m){err=m;return false;}
  err="";
  if(cur==="what"&&!A.what)return bad(d.eChoose);
  if(cur==="who"&&!A.who)return bad(d.eChoose);
  if(cur==="occ"&&!A.occ)return bad(d.eChoose);
  if(cur==="idea"&&!A.idea.trim())return bad(d.eText);
  if(cur==="person"&&!A.person.trim())return bad(d.eText);
  if(cur==="you"){
    if(!A.name.trim())return bad(d.eName);
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(A.mail.trim()))return bad(d.eMail);
  }
  return true;
}
function go(dir){
  var s=steps(),i=s.indexOf(cur);
  if(dir>0){
    if(!validate()){var er=stage.querySelector(".err");if(er){er.textContent=err;er.classList.add("on");}return;}
    if(cur==="you"){submit();return;}
  }
  err="";cur=s[Math.max(0,Math.min(s.length-1,i+dir))];render();window.scrollTo(0,0);
}
function summary(){
  var d=D(),s=d.sum,v=function(x){x=(x||"").trim();return x?x:s.none;};
  var L=[s.title,"",s.what+": "+d.what[A.what],s.who+": "+d.who[A.who],s.occ+": "+d.occ[A.occ]];
  if(A.occ==="other")L.push(s.more+": "+v(A.more));
  L.push("",s.idea+":",v(A.idea));
  if(A.what==="journal")L.push("",s.person+":",v(A.person),"",s.explore+":",v(A.explore),"",s.lang+": "+A.blang);
  L.push("",s.date+": "+v(A.date),s.name+": "+v(A.name),s.mail+": "+v(A.mail),s.ig+": "+v(A.ig));
  return L.join("\n");
}
function submit(){
  var bc=document.getElementById("botcheck");if(bc&&bc.checked)return;
  var btn=document.getElementById("nextBtn");btn.disabled=true;btn.textContent=D().sending;
  var payload={access_key:KEY,subject:"New custom request – "+T.en.what[A.what],from_name:"Pieces of YOU form",
    name:A.name.trim(),email:A.mail.trim(),message:summary(),botcheck:""};
  fetch("https://api.web3forms.com/submit",{method:"POST",headers:{"Content-Type":"application/json",Accept:"application/json"},body:JSON.stringify(payload)})
  .then(function(r){return r.json();})
  .then(function(j){if(j&&j.success){cur="done";render();window.scrollTo(0,0);}else throw new Error("fail");})
  .catch(function(){err=D().eSend;render();});
}
Array.prototype.forEach.call(document.querySelectorAll(".lang button"),function(b){b.addEventListener("click",function(){
  lang=b.getAttribute("data-l");try{localStorage.setItem("pou-lang",lang);}catch(e){}
  Array.prototype.forEach.call(document.querySelectorAll(".lang button"),function(x){x.setAttribute("aria-pressed",x===b?"true":"false");});
  document.documentElement.lang=lang;render();});});
document.addEventListener("keydown",function(e){if(e.key==="Enter"&&e.target&&e.target.tagName==="INPUT"&&e.target.type!=="checkbox"){e.preventDefault();var n=document.getElementById("nextBtn");if(n)n.click();}});
Array.prototype.forEach.call(document.querySelectorAll(".lang button"),function(x){x.setAttribute("aria-pressed",x.getAttribute("data-l")===lang?"true":"false");});
document.documentElement.lang=lang;
render();
})();
