/* Layout: the form is a small booklet. Cover, two intro pages, one question per page, back cover. Black ink on white paper. */
:root{--paper:#fff;--ink:#000;--soft:#666;--dot:#c4c4c4;--font:"PiecesFlow","Nunito",ui-rounded,system-ui,sans-serif;color-scheme:light}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--font);--fs:clamp(13.5px,2.4svh,16.5px);font-size:var(--fs);line-height:1.5;margin:0;display:flex;flex-direction:column;min-height:100vh;min-height:100dvh;
  padding-block:clamp(8px,1.6svh,20px) clamp(8px,1.6svh,24px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3,p,ol,ul{margin:0}
p{text-wrap:pretty}
.soft{color:var(--soft)}
.book{width:100%;max-width:560px;margin:0 auto;flex:1;display:flex;flex-direction:column}
.lang{display:flex;justify-content:flex-end;gap:6px}
.lang button{font:inherit;font-size:14px;font-weight:700;letter-spacing:.08em;background:none;border:1px solid transparent;border-radius:999px;padding:4px 12px;color:var(--soft);cursor:pointer}

.vol{font-size:12px;letter-spacing:.42em;color:var(--ink);font-weight:700;margin:6px 0 24px;padding-left:.42em;text-align:center}

.sec{font-size:20px;margin-top:34px;min-height:0!important;margin-bottom:.15em}
.grid{display:block;width:210px;max-width:58%;margin:0 auto;color:var(--ink)}
.tag{margin-top:24px;font-size:19px;font-weight:700;text-align:center}
.tag2{margin-top:2px;color:var(--soft);text-align:center}

/* content pages */
h2{font-size:1.53em;line-height:1.2;font-weight:700;text-wrap:balance}

.q{font-size:1.53em;line-height:1.2;font-weight:700;text-wrap:balance;margin-bottom:.25em}
.hint{color:var(--soft);font-size:.88em;margin-bottom:.9em;line-height:1.4}
.stack{display:grid;gap:.75em;margin-top:.7em}
.lead{font-size:1.1em;line-height:1.4}
.ttl{font-weight:700;font-size:1.25em;line-height:1.25}
.about{gap:1.1em}
.note{font-weight:700}
.offer{list-style:none;padding:0;margin:0;display:grid;gap:.15em}
.offer li{font-size:1em;padding-left:1.3em;position:relative;line-height:1.35}
.offer li::before{content:"–";position:absolute;left:4px}
.steps{list-style:none;padding:0;display:grid;gap:.7em;margin-top:.9em}
.steps li{display:grid;grid-template-columns:2.4em 1fr;gap:.8em;align-items:center}
.steps .n{width:2.4em;height:2.4em;border:1.6px solid var(--ink);border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:1em}
.jn{display:flex;align-items:center;justify-content:space-between;gap:12px;border:0;padding:0;margin-top:.4em}.jn p{margin:0;font-size:.92em;line-height:1.35}.jn .chan{margin:0;padding:9px 16px;font-size:15px;white-space:nowrap}.avail{margin-top:1em;padding:.7em 1em;border:1.6px solid var(--ink);border-radius:16px}

/* answers */
.chips{display:flex;flex-wrap:wrap;gap:.5em;margin-top:.7em}
.chip{font:inherit;font-size:1em;line-height:1.25;color:var(--ink);background:var(--paper);border:1.6px solid var(--ink);border-radius:999px;padding:.5em 1.05em;cursor:pointer;text-align:left;-webkit-tap-highlight-color:transparent}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.chips.col{flex-direction:column;align-items:stretch}
.vw{display:inline-block;font-size:.82em;margin-top:.35em;color:var(--soft);text-decoration:underline}.vw[hidden]{display:none}
.desc{min-height:2.7em;font-size:.88em;line-height:1.35;color:var(--soft);margin-top:.55em}
@media (max-height:780px){.chips.col{gap:.3em;margin-top:.5em}.chips.col .chip{padding:.36em 1.05em}.desc{margin-top:.35em}}
.chips.col .chip{border-radius:18px}
.field{margin-top:1.1em}
.lbl{display:block;font-weight:700;font-size:1em;margin-bottom:.4em}
textarea,input[type=text],input[type=email],input[type=date]{width:100%;font:inherit;font-size:max(16px,1em);color:var(--ink);background:var(--paper);border:1.6px solid var(--ink);border-radius:16px;padding:.6em .95em;display:block}
textarea{min-height:clamp(110px,24svh,200px);resize:vertical;line-height:1.55;

::placeholder{color:#8a8a8a}
.field+.hint,.hint+.field{margin-top:.6em}
.field+.hint{font-size:.92em}
.err{display:none;font-weight:700;font-size:.88em;margin-top:.7em}
.err.on{display:block}

.btn.pz{position:relative;background:none;border:0;border-radius:0;padding:0;height:54px;font:inherit;font-weight:700;font-size:17px;color:var(--paper);cursor:pointer;-webkit-tap-highlight-color:transparent}

.pg:not(.cover) .nav{position:sticky;bottom:0;z-index:3;background:var(--paper);padding:.5em 0 .3em;margin-top:.6em}

.nav.solo{justify-content:center}
